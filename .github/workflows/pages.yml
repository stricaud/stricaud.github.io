# Build with current Jekyll and publish the result.
#
# GitHub's built-in Pages builder runs the `github-pages` gem, which pins
# Jekyll 3.9 and will not start on a modern Ruby. So the site is built here,
# with the Gemfile in this repository, and the output is uploaded as the Pages
# artifact. One thing to set once, by hand: Settings → Pages → Build and
# deployment → Source → "GitHub Actions".
name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true   # needs Gemfile.lock committed

      - uses: actions/configure-pages@v5

      - run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
