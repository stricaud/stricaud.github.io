<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" width="1600" height="500" role="img"
     aria-label="Dissected packet output: HTTP, DNS and TLS summary lines">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1318"/>
      <stop offset="1" stop-color="#1b232b"/>
    </linearGradient>
    <!-- Dark under the title on the left, clear over the output on the right.
         The two have to be on opposite sides, or one of them wins and the
         banner is either unreadable or blank. -->
    <linearGradient id="scrim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#0e1318" stop-opacity="0.92"/>
      <stop offset="0.30" stop-color="#0e1318" stop-opacity="0.80"/>
      <stop offset="0.52" stop-color="#0e1318" stop-opacity="0.45"/>
      <stop offset="0.66" stop-color="#0e1318" stop-opacity="0.06"/>
      <stop offset="1"    stop-color="#0e1318" stop-opacity="0.00"/>
    </linearGradient>
    <style>
      .m { font-family: "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; font-size: 21px; }
      .l { fill: #aebfcf; }
      .p { fill: #93e6cb; }
      .a { fill: #f0cf90; }
      .d { fill: #64748b; }
    </style>
  </defs>

  <rect width="1600" height="500" fill="url(#bg)"/>

  <g class="m" xml:space="preserve">
    <text x="900" y="92"><tspan class="d">$</tspan><tspan class="l"> ./sniff capture.pcapng</tspan></text>
    <text x="900" y="140"><tspan class="d">  1  </tspan><tspan class="p">HTTP </tspan><tspan class="l">203.0.113.9 -&gt; 10.0.0.5  </tspan><tspan class="a">GET /index.html</tspan></text>
    <text x="900" y="178"><tspan class="d">  2  </tspan><tspan class="p">DNS  </tspan><tspan class="l">203.0.113.9 -&gt; 8.8.8.8   </tspan><tspan class="a">A example.com</tspan></text>
    <text x="900" y="216"><tspan class="d">  3  </tspan><tspan class="p">TLS  </tspan><tspan class="l">203.0.113.9 -&gt; 10.0.0.5  </tspan><tspan class="a">Client Hello</tspan></text>

    <text x="900" y="300"><tspan class="d">$</tspan><tspan class="l"> ./sniff capture.pcapng </tspan><tspan class="a">'tls.handshake_type == 1'</tspan></text>
    <text x="900" y="348"><tspan class="d">  3  </tspan><tspan class="p">TLS  </tspan><tspan class="l">203.0.113.9 -&gt; 10.0.0.5  </tspan><tspan class="a">Client Hello</tspan></text>

    <text x="900" y="430"><tspan class="d">$</tspan><tspan class="l"> ./sniff capture.pcapng </tspan><tspan class="a">'http.uri contains "/index"'</tspan></text>
  </g>

  <rect width="1600" height="500" fill="url(#scrim)"/>
</svg>
